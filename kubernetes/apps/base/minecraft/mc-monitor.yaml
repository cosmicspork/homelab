# Exports the server's status for VictoriaMetrics (apps/base/monitoring):
# whether it answers, its response time, and players online and max. It pings
# the hearth Service directly, not mc-router, so its pings never count as a
# connection that keeps the server awake, and a sleeping server (no
# endpoints) reads as unhealthy instead of mc-router's stand-in status.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mc-monitor
  namespace: minecraft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mc-monitor
  template:
    metadata:
      labels:
        app: mc-monitor
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc-monitor
          image: itzg/mc-monitor:1.18.3
          args:
            - export-for-prometheus
            - -servers
            - hearth:25565
            # It pings during each scrape; the 1m default would outlast the
            # scrape timeout while the server is starting.
            - -timeout
            - 5s
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: metrics
              containerPort: 8080
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          # TCP, not /metrics: a probe that scraped would ping the server too.
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 30
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: mc-monitor
  namespace: minecraft
spec:
  selector:
    app: mc-monitor
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
