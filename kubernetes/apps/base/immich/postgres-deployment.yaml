apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres
  namespace: immich
  annotations:
    ignore-check.kube-linter.io/run-as-non-root: The entrypoint starts as root and steps down to postgres with gosu.
    ignore-check.kube-linter.io/no-read-only-root-fs: The entrypoint writes /etc/postgresql/postgresql.conf at startup.
    ignore-check.kube-linter.io/env-value-from: The immich-postgres Secret was applied out of band and is not in this kustomization yet.
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-postgres
  # Recreate: the PVC is ReadWriteOnce so only one pod can mount it at a time.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # Official Immich postgres image — includes vectorchord + pgvectors
          # extensions that Immich requires. Use the image from the official
          # Immich docker-compose release for the matching Immich version.
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
          # The entrypoint starts as root to write /etc/postgresql and fix the
          # data directory's ownership, then steps down to postgres with gosu.
          # These are the capabilities that sequence needs.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID"]
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: immich
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-postgres
                  key: password
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
            # Block storage volumes have a lost+found dir from ext4 formatting.
            # Postgres refuses to init in a non-empty directory, so use a subdir.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # The image's bundled config (postgresql.ssd.conf, selected by the
          # default DB_STORAGE_TYPE=SSD) sets shared_buffers = 512MB and
          # work_mem = 16MB. Shared buffers count against the cgroup once
          # touched, so a 512Mi limit could OOM-kill postgres as the cache
          # warms. 1Gi covers shared_buffers plus backends, work_mem and
          # autovacuum. The request tracks the realistic hot set: the data
          # directory is ~325Mi on disk today.
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "immich", "-d", "immich"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "immich", "-d", "immich"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-postgres-data
