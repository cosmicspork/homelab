apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 30m
  chart:
    spec:
      chart: immich
      version: 0.12.0
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  valuesFrom:
    - kind: Secret
      name: immich-postgres
      valuesKey: password
      targetPath: controllers.main.containers.main.env.DB_PASSWORD
  values:
    controllers:
      main:
        containers:
          main:
            image:
              # renovate: image=ghcr.io/immich-app/immich-server
              tag: v3.0.3
            env:
              # Service created by postgres-service.yaml
              DB_HOSTNAME: "immich-postgres.immich.svc.cluster.local"
              DB_DATABASE_NAME: immich
              DB_USERNAME: immich
              # DB_PASSWORD injected via valuesFrom above

    immich:
      persistence:
        library:
          existingClaim: immich-library

    valkey:
      enabled: true
      # Valkey only holds Immich's BullMQ job queues (no persistence, no
      # maxmemory set). Observed ~11Mi working set at idle; a large import can
      # queue many jobs, so the limit leaves room for that without letting a
      # runaway queue starve the node.
      controllers:
        main:
          # The image's entrypoint only steps down from root to valkey (999);
          # starting as 999 skips that. /data is an emptyDir, so the root
          # filesystem can be read-only.
          pod:
            securityContext:
              runAsNonRoot: true
              runAsUser: 999
              runAsGroup: 999
              fsGroup: 999
              seccompProfile:
                type: RuntimeDefault
          containers:
            main:
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 256Mi

    server:
      # Set here rather than under the top-level controllers.main, which the
      # chart merges into every component (valkey included).
      # Machine learning is disabled, so this container is the whole Immich
      # app: API plus the microservices workers (thumbnails via libvips,
      # video transcodes via ffmpeg). Observed ~680Mi working set at idle
      # after a restart with a ~60GiB library; the request sits just above
      # that. Thumbnailing and transcoding spike well past idle, so the limit
      # is generous. No CPU limit, matching the rest of the repo; jobs burst
      # onto idle cores.
      controllers:
        main:
          # The library is a ReadWriteOnce volume. A rolling update can start
          # the new pod on a different node (a surge upgrade adds one) where
          # the volume cannot attach while the old pod still holds it.
          strategy: Recreate
          pod:
            securityContext:
              seccompProfile:
                type: RuntimeDefault
          containers:
            main:
              # Runs as root because everything in the library is owned by
              # root, but needs no capabilities: it binds 2283 and never
              # changes user.
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 768Mi
                limits:
                  memory: 2Gi
      # Public traffic arrives through cloudflared, which routes to the
      # immich-server Service directly.
      ingress:
        main:
          enabled: false

    machine-learning:
      enabled: false
