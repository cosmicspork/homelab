apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  # Apps won't be reconciled until infrastructure is healthy.
  # This ensures cert-manager's CRDs exist before tracon-build's PKI is applied.
  dependsOn:
    - name: infrastructure
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 1h
  path: ./kubernetes/apps/production
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
