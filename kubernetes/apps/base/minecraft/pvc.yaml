# The server directory: world, pack files and ops/whitelist. Sized when it
# also held Simple Backups' zips, which are off now that VolSync copies the
# volume to R2.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hearth-data
  namespace: minecraft
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: do-block-storage-retain
  resources:
    requests:
      storage: 20Gi
