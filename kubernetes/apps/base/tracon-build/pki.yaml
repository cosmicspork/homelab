# mTLS for buildkitd: a private CA used for nothing else.
#
# Why a ClusterIssuer: the node's client certificate has to land in
# tracon-node, and a Certificate can only name an Issuer in its own namespace
# or a ClusterIssuer. A namespaced CA Issuer in tracon-build cannot issue into
# tracon-node, and cert-manager alone cannot copy a Secret across namespaces.
# Putting a CA Issuer in tracon-node instead would put the CA key in a
# namespace whose service account can read Secrets (the node's), letting a
# compromised node mint a server certificate and impersonate buildkitd.
#
# So the CA key lives in cert-manager's own namespace (where a CA ClusterIssuer
# must keep it), readable by nothing in tracon-node or tracon-build. The cost:
# whoever can create a Certificate (or an Ingress annotated for this issuer) in
# any namespace could get a client certificate. Today that is only Flux and the
# cluster admin; no workload holds cert-manager.io rights. A certificate alone
# is still not enough to reach buildkitd: its NetworkPolicy admits only the
# tracon node pod and the smoke test. If that ever changes, cert-manager's
# approver-policy can pin which namespaces may use this issuer.
#
# Leaf usages are explicit, so the server certificate cannot act as a client
# and the client certificates cannot act as the server.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: buildkit-selfsigned
  namespace: cert-manager
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: buildkit-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: tracon-build buildkit CA
  secretName: buildkit-ca
  # Ten years. Renewing the CA re-keys it, which breaks trust until every
  # leaf is reissued and buildkitd restarts; at this length that is a
  # once-a-decade chore, not a surprise.
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: Issuer
    name: buildkit-selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: buildkit-ca
spec:
  ca:
    secretName: buildkit-ca
---
# buildkitd reads its certificate once at startup; its liveness probe
# restarts it when this Secret is renewed (see statefulset.yaml). A year keeps
# that restart rare.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: buildkitd-server
  namespace: tracon-build
spec:
  secretName: buildkitd-server-tls
  commonName: buildkitd.tracon-build.svc
  dnsNames:
    - buildkitd.tracon-build.svc
    - buildkitd.tracon-build.svc.cluster.local
  duration: 8760h
  renewBefore: 720h
  usages:
    - digital signature
    - key encipherment
    - server auth
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    kind: ClusterIssuer
    name: buildkit-ca
---
# For the tracon node, which mounts it (H3) and passes the directory to
# `buildctl --tlsdir`. buildctl reads cert-manager's ca.crt, tls.crt and
# tls.key names as they are, so no key remapping is needed. buildctl loads the
# files per invocation, so renewal needs no restart on the node side.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: buildkit-client
  namespace: tracon-node
spec:
  secretName: buildkit-client-tls
  commonName: tracon-node
  duration: 2160h
  renewBefore: 360h
  usages:
    - digital signature
    - key encipherment
    - client auth
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    kind: ClusterIssuer
    name: buildkit-ca
---
# For the smoke-test Job, which lives in tracon-build and so cannot mount the
# node's Secret.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: buildkit-smoke-client
  namespace: tracon-build
spec:
  secretName: buildkit-smoke-tls
  commonName: buildkit-smoke
  duration: 2160h
  renewBefore: 360h
  usages:
    - digital signature
    - key encipherment
    - client auth
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    kind: ClusterIssuer
    name: buildkit-ca
