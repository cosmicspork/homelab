# mTLS only; see buildkitd.toml. Reachable from the tracon node pod only, per
# networkpolicy.yaml.
apiVersion: v1
kind: Service
metadata:
  name: buildkitd
  namespace: tracon-build
spec:
  selector:
    app.kubernetes.io/name: buildkitd
  ports:
    - name: grpc
      port: 1234
      targetPort: 1234
      protocol: TCP
