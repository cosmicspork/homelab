apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - buildkitd-certs-secret.yaml
  - pvc.yaml
  - networkpolicy.yaml
  - statefulset.yaml
  - service.yaml
# Hash-suffixed, so a config change (such as the native-snapshotter fallback)
# rolls buildkitd on the next reconcile.
configMapGenerator:
  - name: buildkitd
    namespace: tracon-build
    files:
      - buildkitd.toml
