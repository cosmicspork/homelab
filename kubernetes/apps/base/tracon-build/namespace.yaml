apiVersion: v1
kind: Namespace
metadata:
  name: tracon-build
  labels:
    # Rootless BuildKit needs seccomp and AppArmor Unconfined: its build steps
    # call unshare and mount inside a user namespace, which RuntimeDefault and
    # the containerd AppArmor profile both refuse. Baseline forbids Unconfined
    # too, so this namespace is privileged. Nothing else belongs here, and
    # buildkitd itself still runs as uid 1000, not root.
    #
    # warn and audit stay at restricted so anything that relies on the wider
    # profile is called out on every apply.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
