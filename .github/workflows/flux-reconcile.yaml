name: Flux Reconcile

on:
  push:
    branches: [main]

# Nothing here reads the repository; the cluster credentials come from the
# DigitalOcean token.
permissions: {}

jobs:
  reconcile:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Get kubeconfig
        run: |
          mkdir -p $HOME/.kube
          doctl kubernetes cluster kubeconfig show homelab > $HOME/.kube/config

      - name: Install Flux CLI
        run: curl -s https://fluxcd.io/install.sh | sudo bash

      - name: Reconcile
        run: flux reconcile source git flux-system
