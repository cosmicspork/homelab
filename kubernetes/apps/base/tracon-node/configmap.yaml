apiVersion: v1
kind: ConfigMap
metadata:
  name: tracon-node
  namespace: tracon-node
data:
  # Seeded onto the state volume on first start (see the init container);
  # after that the file on the volume is authoritative, because `tracon
  # enroll` writes to it. Edit it there, or delete it to reseed.
  node.toml: |
    node_name = "homelab"

    [runtime]
    kind = "kubernetes"

    # Builds repository images on buildkitd (tracon-build) and pushes them to
    # DOCR.
    [runtime.kubernetes.builder]
    addr = "tcp://buildkitd.tracon-build.svc:1234"
    tls_dir = "/etc/tracon/buildkit"
    registry = "registry.digitalocean.com/cosmicspork"
    docker_config = "/etc/tracon/registry"

    # Checks and preparations: a tracon `just check` peaks around 3.9 GiB, so
    # each asks for 4Gi and may burst to 6Gi. They run on the tracon-sandbox
    # pool (below), not beside immich and the rest on the general node.
    [runtime.kubernetes.resources.command]
    memory_request = "4Gi"
    memory_limit = "6Gi"

    # Every sandbox pod (sessions, checks, preparations) runs on the
    # tracon-sandbox node pool, which autoscales 0-1 (README, "tracon
    # sandbox pool"). While it has no node the node waits for the autoscaler
    # to add one, up to scale_up_grace_secs; once it is full, sessions
    # overflow to DigitalOcean ([placement] below) and checks queue.
    [runtime.kubernetes.pool]
    node_selector = { workload = "tracon-sandbox" }
    tolerations = [{ key = "workload", value = "tracon-sandbox", effect = "NoSchedule" }]
    scale_up_grace_secs = 600

    [gateway]
    harness_listen = "0.0.0.0:7421"

    [session]
    worktree_root = "/state/work"

    [consulta]
    command = "uv"
    args = ["run", "--project", "/opt/consulta", "consulta"]

    [mesh]
    # The public name, not the cluster service: DigitalOcean sandboxes reach
    # this node through the hub's relay at this URL's host.
    hub_url = "https://tracon-hub.0x69.xyz"

    # DigitalOcean: this node builds templates on buildkitd for itself and
    # for peers that ask (bazzite builds its own too), and places a session
    # there when the cluster is full. Needs the `do` credential lent to it.
    [mesh.sandbox_relay]
    enabled = true
    target = "127.0.0.1:8443"

    [digitalocean]
    credential = "do"
    registry = "registry.digitalocean.com/cosmicspork"
    relay = true
    listen = "127.0.0.1:8443"
    limit = 2

    [placement]
    digitalocean = "overflow"

    # Client work never runs on DigitalOcean: when the pool is full its
    # sessions are refused and its checks wait in line.
    [[placement.repo]]
    path = "github.com/hounddogreading/hounddogreading"
    client = true
