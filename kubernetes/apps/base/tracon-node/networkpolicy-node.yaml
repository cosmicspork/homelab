# The node accepts its harnesses on the forward and proxy ports, and the
# ingress controller on the operator API. A port-forward (or the Coder tunnel)
# enters via the kubelet and is not subject to this either way.
#
# Opening 7420 to the ingress is what lets the phone reach this node; the API
# itself refuses anything off-loopback without the operator token, so the
# policy and the node's own guard both have to be passed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: tracon-node
  name: tracon-node
spec:
  podSelector:
    matchLabels:
      tracon.dev/role: node
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tracon.dev/role: harness
      ports:
        - protocol: TCP
          port: 7421
        - protocol: TCP
          port: 8888
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 7420
