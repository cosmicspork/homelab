apiVersion: v1
kind: ConfigMap
metadata:
  name: tracon-node
  namespace: tracon-node
data:
  # Seeded onto the state volume on first start (see the init container);
  # after that the file on the volume is authoritative, because `tracon
  # enroll` writes to it. Edit it there, or delete it to reseed.
  node.toml: |
    node_name = "homelab"

    [runtime]
    kind = "kubernetes"

    # Builds repository images on buildkitd (tracon-build) and pushes them to
    # DOCR. Needs a tracon release with the Kubernetes builder; uncomment then.
    # The live file on the PVC is what the node reads, so edit it there too.
    # [runtime.kubernetes.builder]
    # addr = "tcp://buildkitd.tracon-build.svc:1234"
    # tls_dir = "/etc/tracon/buildkit"
    # registry = "registry.digitalocean.com/cosmicspork"
    # docker_config = "/etc/tracon/registry"

    [gateway]
    harness_listen = "0.0.0.0:7421"

    [session]
    worktree_root = "/state/work"

    [consulta]
    command = "uv"
    args = ["run", "--project", "/opt/consulta", "consulta"]

    [mesh]
    # The hub shares this cluster; talk to it by service, not by the public name.
    hub_url = "http://tracon-hub.tracon.svc.cluster.local"
