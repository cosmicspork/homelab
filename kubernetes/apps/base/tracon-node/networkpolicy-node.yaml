# The node accepts its sandboxes on the sandbox port, buildkitd on the egress
# port (the proxy a repository's `build` steps fetch through), and
# cloudflared on the operator API. A port-forward (or the Coder tunnel)
# enters via the kubelet and is not subject to this either way.
#
# Opening 7420 to cloudflared is what lets the phone reach this node; Cloudflare
# Access and the node's operator token both have to be passed, since the API
# refuses anything off-loopback without the token.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: tracon-node
  name: tracon-node
spec:
  podSelector:
    matchLabels:
      tracon.dev/role: node
      tracon.dev/node: tracon
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tracon.dev/role: sandbox
              tracon.dev/node: tracon
      ports:
        - protocol: TCP
          port: 7426
    # Each build gets a grant of the per-client egress proxy for exactly its
    # entry's `egress` hosts, which BuildKit hands every RUN step as its proxy.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tracon-build
          podSelector:
            matchLabels:
              app.kubernetes.io/name: buildkitd
      ports:
        - protocol: TCP
          port: 7424
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
      ports:
        - protocol: TCP
          port: 7420
