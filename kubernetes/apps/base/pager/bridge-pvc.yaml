# The bridge's identity and its paired devices. Losing this loses the pairing
# and the key the relay authorizes, so it is retained.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pager-bridge
  namespace: pager
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: do-block-storage-retain
  resources:
    requests:
      storage: 1Gi
