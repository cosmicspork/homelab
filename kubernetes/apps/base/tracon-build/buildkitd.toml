# Loaded by buildkitd via --config. Generated into a hash-suffixed ConfigMap
# (kustomization.yaml), so editing this file rolls the pod.

[grpc]
  # The unix socket is for the probes inside the pod; TLS does not apply
  # to it. Port 1234 is mTLS only: with a CA set, buildkitd requires and
  # verifies a client certificate.
  address = ["unix:///run/user/1000/buildkit/buildkitd.sock", "tcp://0.0.0.0:1234"]
  [grpc.tls]
    cert = "/certs/tls.crt"
    key = "/certs/tls.key"
    ca = "/certs/ca.crt"

[worker.containerd]
  enabled = false

[worker.oci]
  enabled = true
  # Native overlayfs inside the user namespace: the DOKS node kernel is
  # 6.12 (Debian 13), past the 5.11 that allows unprivileged overlay
  # mounts. Named explicitly rather than "auto" so a kernel that refuses
  # it fails loudly at startup instead of silently copying every layer.
  #
  # Fallback if buildkitd crash-loops on an overlay mount error: set this
  # to "native" (slower, and each layer is a full copy, so the GC limits
  # below matter more). fuse-overlayfs is not an option here: it needs
  # /dev/fuse, which a pod only gets by being privileged.
  snapshotter = "overlayfs"
  # Half of the node's four vCPUs, so concurrent build steps leave room
  # for harness sessions; it also bounds peak memory against the 3Gi limit.
  max-parallelism = 2

  # The cache is a 20Gi emptyDir on the node's disk (statefulset.yaml); the
  # kubelet evicts the pod if it grows past that. Keep BuildKit under about
  # 15GB, and keep 15GB of the node's disk free since the cache now shares it
  # with every pod. That still holds a repository image like hounddogreading's
  # (a few GiB) and its base layers. Mirrors BuildKit's default policy tiers,
  # with more room for cache mounts (composer and npm caches) than the 512MB
  # default. Anything unused for 30 days goes first.
  gc = true
  [[worker.oci.gcpolicy]]
    filters = ["type==source.local", "type==exec.cachemount", "type==source.git.checkout"]
    keepDuration = "168h"
    maxUsedSpace = "3GB"
  [[worker.oci.gcpolicy]]
    keepDuration = "720h"
    reservedSpace = "2GB"
    maxUsedSpace = "15GB"
    minFreeSpace = "15GB"
  [[worker.oci.gcpolicy]]
    reservedSpace = "2GB"
    maxUsedSpace = "15GB"
    minFreeSpace = "15GB"
  [[worker.oci.gcpolicy]]
    all = true
    reservedSpace = "2GB"
    maxUsedSpace = "15GB"
    minFreeSpace = "15GB"
