# The node accepts its harnesses on the forward, proxy and egress ports, and
# cloudflared on the operator API. A port-forward (or the Coder tunnel) enters
# via the kubelet and is not subject to this either way.
#
# Opening 7420 to cloudflared is what lets the phone reach this node; Cloudflare
# Access and the node's operator token both have to be passed, since the API
# refuses anything off-loopback without the token.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: tracon-node
  name: tracon-node
spec:
  podSelector:
    matchLabels:
      tracon.dev/role: node
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tracon.dev/role: harness
      ports:
        - protocol: TCP
          port: 7421
        - protocol: TCP
          port: 8888
        - protocol: TCP
          port: 7424
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
      ports:
        - protocol: TCP
          port: 7420
