apiVersion: v1
kind: ConfigMap
metadata:
  name: tracon-node
  namespace: tracon-node
data:
  # Seeded onto the state volume on first start (see the init container);
  # after that the file on the volume is authoritative, because `tracon
  # enroll` writes to it. Edit it there, or delete it to reseed.
  node.toml: |
    node_name = "homelab"

    [runtime]
    kind = "kubernetes"

    [gateway]
    harness_listen = "0.0.0.0:7421"

    [session]
    worktree_root = "/state/work"

    [consulta]
    command = "uv"
    args = ["run", "--project", "/opt/consulta", "consulta"]

    [mesh]
    # The hub shares this cluster; talk to it by service, not by the public name.
    hub_url = "http://tracon-hub.tracon.svc.cluster.local"

    [notify]
    # The bridge in this cluster, not the one on a laptop: this node is the one
    # that is awake when the laptops are not. It holds the device keys and does
    # the sealing; the node hands it cleartext over the pod network.
    pager_url = "http://pager-bridge.pager.svc.cluster.local/capture"
    # Where a notification's link should point, so tapping one opens the queue.
    link_origin = "https://tracon-node.0x69.xyz"
