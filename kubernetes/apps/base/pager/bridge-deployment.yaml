# A second bridge, beside the always-on services rather than on a laptop.
#
# A bridge is what turns a plaintext event into a per-device sealed payload: it
# holds the device keys, and the relay only ever sees ciphertext. Running one
# here is what lets something in this cluster page the phone while every laptop
# is asleep — which is the whole point of tracon's node living here.
#
# It is a *second* bridge, not a replacement: the laptop's keeps forwarding what
# the browser extension captures. Pair the phone to both. The relay authorizes
# several bridge keys, so neither can read the other's traffic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pager-bridge
  namespace: pager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pager-bridge
  # Recreate: the identity is one ReadWriteOnce volume and two pods cannot
  # mount it at once.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pager-bridge
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bridge
          image: ghcr.io/cosmicspork/pager-bridge:0.6.1
          imagePullPolicy: Always
          args: ["run"]
          ports:
            - containerPort: 4500
          env:
            # In-cluster, so the relay's service rather than its public name.
            - name: PAGER_RELAY_URL
              value: http://pager.pager.svc.cluster.local
            # The capture endpoint is unauthenticated by design; the network
            # policy is what bounds who may reach it.
            - name: PAGER_CAPTURE_ADDR
              value: 0.0.0.0:4500
            - name: PAGER_CONFIG_DIR
              value: /state
            - name: RUST_LOG
              value: info
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /state
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 4500
            initialDelaySeconds: 3
            periodSeconds: 20
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: pager-bridge
