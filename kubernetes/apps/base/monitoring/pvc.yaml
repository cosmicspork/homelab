apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoria-metrics-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: do-block-storage-retain
  resources:
    requests:
      # A few thousand series at 30s for 90 days compress to well under 1Gi;
      # the rest is room to add scrape targets without resizing.
      storage: 5Gi
