# The boundary. A harness pod accepts only the node's pod, and may reach only
# the node's pod, on the forward (MCP), proxy and egress ports. No DNS, no API
# server, no internet: everything else the harness needs goes through the
# node's allowlist proxy, or through the per-client egress proxy on 7424 with
# credentials the node issued to that one run. The node verifies this
# policy's shape at startup and refuses to run harnesses if it is missing or
# wider. Without 7424 it still runs, and issues no egress grants.
#
# The ingress is for OpenCode, which the node drives over HTTP on a port it
# picks per launch, so no port is named; the peer is what is narrowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: tracon-node
  name: tracon-harness
spec:
  podSelector:
    matchLabels:
      tracon.dev/role: harness
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tracon.dev/role: node
  egress:
    - to:
        - podSelector:
            matchLabels:
              tracon.dev/role: node
      ports:
        - protocol: TCP
          port: 7421
        - protocol: TCP
          port: 8888
        - protocol: TCP
          port: 7424
