apiVersion: v1
kind: ConfigMap
metadata:
  name: tracon-node
  namespace: tracon-node
data:
  # Seeded onto the state volume on first start (see the init container);
  # after that the file on the volume is authoritative, because `tracon
  # enroll` writes to it. Edit it there, or delete it to reseed.
  node.toml: |
    node_name = "homelab"

    [runtime]
    kind = "kubernetes"

    # Builds repository images on buildkitd (tracon-build) and pushes them to
    # DOCR.
    [runtime.kubernetes.builder]
    addr = "tcp://buildkitd.tracon-build.svc:1234"
    tls_dir = "/etc/tracon/buildkit"
    registry = "registry.digitalocean.com/cosmicspork"
    docker_config = "/etc/tracon/registry"

    [runtime.kubernetes.resources.command]
    # The default 2Gi request does not fit beside everything else on the one
    # 8 GiB node; captured pods are pinned to it, so they are refused rather
    # than left pending. The 4Gi limit still lets a test suite burst.
    memory_request = "1Gi"

    [gateway]
    harness_listen = "0.0.0.0:7421"

    [session]
    worktree_root = "/state/work"

    [consulta]
    command = "uv"
    args = ["run", "--project", "/opt/consulta", "consulta"]

    [mesh]
    # The public name, not the cluster service: DigitalOcean sandboxes reach
    # this node through the hub's relay at this URL's host.
    hub_url = "https://tracon-hub.0x69.xyz"

    # DigitalOcean: this node builds templates on buildkitd for itself and
    # for peers that ask (bazzite builds its own too), and places a session
    # there when the cluster is full. Needs the `do` credential lent to it.
    [mesh.sandbox_relay]
    enabled = true
    target = "127.0.0.1:8443"

    [digitalocean]
    credential = "do"
    registry = "registry.digitalocean.com/cosmicspork"
    relay = true
    listen = "127.0.0.1:8443"
    limit = 2

    [placement]
    digitalocean = "overflow"

    [[placement.repo]]
    path = "github.com/hounddogreading/hounddogreading"
    client = true
