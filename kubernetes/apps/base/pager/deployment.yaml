apiVersion: apps/v1
kind: Deployment
metadata:
  name: pager
  namespace: pager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pager
  # Recreate, not RollingUpdate: the subscription store is a single ReadWriteOnce
  # volume, so two pods can't mount it at once.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pager
    spec:
      # The relay runs as nobody (65534); fsGroup makes the block volume writable
      # so it can persist subscriptions to /data.
      securityContext:
        fsGroup: 65534
      containers:
        - name: pager
          image: ghcr.io/cosmicspork/pager:0.6.0
          imagePullPolicy: Always
          ports:
            - containerPort: 4500
          env:
            # The bridge public keys allowed to ingest, comma-separated. Each
            # bridge seals to its own paired devices, so authorizing a second
            # sender does not let either read the other's traffic.
            #
            # The first is the laptop's. The cluster bridge's key is not here
            # yet: it mints its identity on first start, so it has to be read
            # off the running pod (`kubectl exec deploy/pager-bridge -n pager
            # -- pager-bridge id`) and appended, comma-separated. Until then
            # the cluster bridge gets 401 from the relay and nothing is lost
            # but its own pushes.
            - name: PAGER_BRIDGE_PUBKEY
              value: "f3797abfe2eefceb7c7588ee88f3ca31be858f48fd7d2919f2b169c8f41191bf"
            # Persist subscriptions across restarts so devices stay registered.
            - name: PAGER_SUBS_FILE
              value: /data/subs.json
            # Surface relay info logs (startup, push results) in `kubectl logs`.
            - name: RUST_LOG
              value: info
          volumeMounts:
            - name: data
              mountPath: /data
            - name: vapid
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /api/config
              port: 4500
            initialDelaySeconds: 3
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /api/config
              port: 4500
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pager-data
        - name: vapid
          secret:
            secretName: pager-vapid
