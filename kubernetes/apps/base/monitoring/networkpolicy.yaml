# Default deny for the namespace; each pod gets only what it needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# In: cloudflared, for metrics.0x69.xyz (behind Access). Out: DNS and the
# scrape targets. The API server and the kubelets are in
# networkpolicy-cilium.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: victoria-metrics
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: victoria-metrics
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
          podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - protocol: TCP
          port: 8428
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kube-state-metrics
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: minecraft
          podSelector:
            matchLabels:
              app: mc-monitor
      ports:
        - protocol: TCP
          port: 8080
---
# In: VictoriaMetrics. Out: only the API server (networkpolicy-cilium.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: victoria-metrics
      ports:
        - protocol: TCP
          port: 8080
