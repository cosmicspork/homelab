apiVersion: v1
kind: ConfigMap
metadata:
  name: tracon-node
  namespace: tracon-node
data:
  # Seeded onto the state volume on first start (see the init container);
  # after that the file on the volume is authoritative, because `tracon
  # enroll` writes to it. Edit it there, or delete it to reseed.
  node.toml: |
    node_name = "homelab"

    # The name cloudflared publishes this node under. Passkeys and every admin
    # action from off the node (the phone, a peer) need it; without it they
    # are refused. cloudflared runs in the pod network (10.111.0.0/16), so its
    # X-Forwarded-For is believed when the node tells callers apart.
    # [notify] contact is set on the volume only: it is an email address and
    # this repository is public. Unset, push falls back to public_origin.
    [auth]
    public_origin = "https://tracon-node.0x69.xyz"
    trusted_proxies = ["10.111.0.0/16"]

    [runtime]
    kind = "kubernetes"

    [runtime.kubernetes]
    internal_cidrs = ["167.71.5.74/32"]

    # Builds repository images on buildkitd (tracon-build) and pushes them to
    # DOCR.
    [runtime.kubernetes.builder]
    addr = "tcp://buildkitd.tracon-build.svc:1234"
    tls_dir = "/etc/tracon/buildkit"
    registry = "registry.digitalocean.com/cosmicspork"
    docker_config = "/etc/tracon/registry"

    # Checks and preparations: a tracon `just check` peaks around 3.9 GiB, so
    # each asks for 4Gi and may burst to 6Gi. They run on the tracon-sandbox
    # pool (below), not beside immich and the rest on the general node.
    [runtime.kubernetes.resources.command]
    memory_request = "4Gi"
    memory_limit = "6Gi"

    [runtime.kubernetes.resources.session]
    memory_request = "1400Mi"

    # Every sandbox pod (sessions, checks, preparations) runs on the
    # tracon-sandbox node pool, which autoscales 0-1 (README, "tracon
    # sandbox pool"). While it has no node the node waits for the autoscaler
    # to add one, up to scale_up_grace_secs; once it is full, sessions
    # overflow to DigitalOcean ([placement] below) and checks queue.
    [runtime.kubernetes.pool]
    node_selector = { workload = "tracon-sandbox" }
    tolerations = [{ key = "workload", value = "tracon-sandbox", effect = "NoSchedule" }]
    scale_up_grace_secs = 600

    [gateway]
    harness_listen = "0.0.0.0:7421"
    allow_hosts = [
      '^api\.anthropic\.com$',
      '^api\.openai\.com$',
      '^chatgpt\.com$',
      '^auth\.openai\.com$',
      '^platform\.claude\.com$',
      '^claude\.ai$',
    ]

    [session]
    worktree_root = "/state/work"
    budget_tokens = 2000000

    # The models each harness is offered. Declared here, and kept identical
    # to the local node's, so a reseed doesn't fall back to the node's
    # built-in defaults, which trail the current generation.
    [providers.anthropic]
    credential = "anthropic"
    login = "anthropic"
    shape = "anthropic"
    upstream = "https://api.anthropic.com"

    [[providers.anthropic.models]]
    attachment = true
    context = 1000000
    id = "claude-fable-5-2"
    name = "Claude Fable 5.2"
    output = 128000
    reasoning = true
    parallel_tools = true
    reasoning_effort = "high"

    [[providers.anthropic.models]]
    attachment = true
    context = 1000000
    id = "claude-opus-5-5"
    name = "Claude Opus 5.5"
    output = 128000
    reasoning = true
    parallel_tools = true
    reasoning_effort = "high"

    [[providers.anthropic.models]]
    attachment = true
    context = 1000000
    id = "claude-sonnet-5-5"
    name = "Claude Sonnet 5.5"
    output = 128000
    reasoning = true
    parallel_tools = true
    reasoning_effort = "high"

    [[providers.anthropic.models]]
    attachment = true
    context = 1000000
    id = "claude-haiku-5-5"
    name = "Claude Haiku 5.5"
    output = 128000
    reasoning = true
    parallel_tools = true
    reasoning_effort = "high"

    [providers.openai-codex]
    credential = "openai-codex"
    login = "openai"
    shape = "openai-codex"
    upstream = "https://chatgpt.com/backend-api"

    [[providers.openai-codex.models]]
    attachment = true
    context = 400000
    id = "gpt-6-luna"
    name = "GPT-6 Luna"
    output = 128000
    reasoning = true
    parallel_tools = true
    reasoning_effort = "high"

    [mesh]
    # The public name, not the cluster service: DigitalOcean sandboxes reach
    # this node through the hub's relay at this URL's host.
    hub_url = "https://tracon-hub.0x69.xyz"
    admin_peers = ["2b310f36c18605ac9ab367ec3abe4fe9aaa6aee04e64db98b0ea364e5e6b3013"]

    # DigitalOcean: this node builds templates on buildkitd for itself and
    # for peers that ask (bazzite builds its own too), and places a session
    # there when the cluster is full. Needs the `do` credential lent to it.
    [mesh.sandbox_relay]
    enabled = true
    target = "127.0.0.1:8443"

    [digitalocean]
    credential = "do"
    registry = "registry.digitalocean.com/cosmicspork"
    relay = true
    listen = "127.0.0.1:8443"
    limit = 2
    size = "mars-4vcpu-8gb"

    [placement]
    digitalocean = "overflow"
    local_limit = 1

    # Client work never runs on DigitalOcean: when the pool is full its
    # sessions are refused and its checks wait in line.
    [[placement.repo]]
    path = "github.com/hounddogreading/hounddogreading"
    client = true

    # tracon sessions are placed only where the sandbox is a microVM.
    [[placement.repo]]
    path = "github.com/cosmicspork/tracon"

    [placement.repo.require]
    tier = ["microvm"]

    # Plugin tools that run without a card. hora's drafts and proposals are
    # its own review; hoja's own type gates turn agent writes into hoja cards;
    # workboard's reads only (its writes are consequential and always asked).
    # Offered on no channel for now: their data stays on another node until
    # a plugin's page can be opened from a node other than its own. Then the
    # data moves here and channels becomes ["personal"].
    [[plugin]]
    name = "hora"
    channels = []
    allow = ["time_*"]

    [[plugin]]
    name = "hoja"
    channels = []
    allow = ["types", "records", "record_show", "record_create", "record_edit", "documents", "document_show", "document_create", "document_edit", "document_select", "document_build", "card_status"]

    [[plugin]]
    name = "workboard"
    channels = []
    allow = ["board", "task", "projects"]

    # The repositories this node keeps an environment for: how each image is
    # built and prepared, and the checks a review runs.
    [[repo]]
    path = "github.com/hounddogreading/hounddogreading"
    build = [
      "apt-get update && apt-get install -y --no-install-recommends php8.5-exif php8.5-sockets php8.5-imagick php8.5-pcov librsvg2-bin && rm -rf /var/lib/apt/lists/*",
      "cd /tmp && npx --yes playwright@1.61.1 install-deps chromium && PLAYWRIGHT_BROWSERS_PATH=/opt/ms-playwright npx --yes playwright@1.61.1 install chromium && chmod -R a+rX /opt/ms-playwright && rm -rf /root/.npm /var/lib/apt/lists/*",
    ]
    prepare = [
      "composer install --no-interaction --prefer-dist --no-scripts",
      "npm ci --ignore-scripts",
      "npm run build",
      "cp -n .env.example .env",
      "php artisan key:generate",
    ]
    prepare_credentials = ["nova"]
    checks = [
      "./vendor/bin/pint --test",
      "./vendor/bin/phpstan analyse --memory-limit=1G",
      "npm run format:check",
      "npm run lint",
      "npm run typecheck",
      "npm run test:coverage",
      "php artisan test --parallel --testsuite=Unit,Feature",
      "PLAYWRIGHT_BROWSERS_PATH=/opt/ms-playwright php artisan test --testsuite=Browser",
    ]
    egress = [
      "packagist",
      "npm",
      "nova.laravel.com",
      "fls-a3093975-8443-4c2e-a646-0501a78a92e9.367be3a2035528943240074d0096e0cd.r2.cloudflarestorage.com",
      "apt",
      "cdn.playwright.dev",
      "playwright.download.prss.microsoft.com",
      "playwright.azureedge.net",
      "storage.googleapis.com",
    ]
    session_egress = true
    timeout_secs = 1800

    [[repo]]
    path = "github.com/cosmicspork/tracon"
    build = [
      "apt-get update && apt-get install -y --no-install-recommends libssl-dev perl just && rm -rf /var/lib/apt/lists/* && just --version",
      'curl -fsSL -o /tmp/rustup-init "https://static.rust-lang.org/rustup/dist/$(uname -m)-unknown-linux-gnu/rustup-init" && chmod +x /tmp/rustup-init && CARGO_HOME=/usr/local/cargo RUSTUP_HOME=/usr/local/rustup /tmp/rustup-init -y --no-modify-path --profile minimal --default-toolchain 1.98.1 -c clippy -c rustfmt && rm /tmp/rustup-init && ln -s /usr/local/rustup/toolchains/1.98.1-*/bin/* /usr/local/bin/',
      'case "$(uname -m)" in aarch64) a=aarch64 d=54328bbc2d9c8e0c9f892c544d66c57a83b84139e34909e5ee81758f1ac8fda7 ;; x86_64) a=x64 d=36368faef7527875d5ffa52e53cd48021741f2a83eb6208a8dd64068d422a913 ;; *) exit 1 ;; esac && curl -fsSL -o /tmp/bun.zip "https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-linux-$a.zip" && echo "$d  /tmp/bun.zip" | sha256sum -c - && unzip -q /tmp/bun.zip -d /tmp && install -m 0755 "/tmp/bun-linux-$a/bun" /usr/local/bin/bun && rm -rf /tmp/bun.zip "/tmp/bun-linux-$a"',
    ]
    prepare = ["cargo fetch --locked", "cd spa && bun install --frozen-lockfile"]
    checks = ["just check"]
    egress = [
      "apt",
      "crates",
      "npm",
      "github",
      "static.rust-lang.org",
      "release-assets.githubusercontent.com",
      "objects.githubusercontent.com",
      "sh.rustup.rs",
      "raw.githubusercontent.com",
    ]
    session_egress = true
    timeout_secs = 2400

    [[repo]]
    path = "github.com/cosmicspork/jira-review"
    build = [
      'curl -fsSL -o /tmp/rustup-init "https://static.rust-lang.org/rustup/dist/$(uname -m)-unknown-linux-gnu/rustup-init" && chmod +x /tmp/rustup-init && CARGO_HOME=/usr/local/cargo RUSTUP_HOME=/usr/local/rustup /tmp/rustup-init -y --no-modify-path --profile minimal --default-toolchain stable -c clippy -c rustfmt && rm /tmp/rustup-init && ln -s /usr/local/rustup/toolchains/stable-*/bin/* /usr/local/bin/',
    ]
    prepare = [
      "if [ -f Cargo.lock ]; then cargo fetch --locked; else cargo --version; fi",
    ]
    checks = [
      "cargo fmt --check",
      "cargo clippy --all-targets -- -D warnings",
      "cargo test",
    ]
    egress = [
      "crates",
      "github",
      "static.rust-lang.org",
      "release-assets.githubusercontent.com",
      "objects.githubusercontent.com",
    ]
    session_egress = true
    timeout_secs = 1800

    [[repo]]
    path = "github.com/cosmicspork/sql-review"
    build = [
      'curl -fsSL -o /tmp/rustup-init "https://static.rust-lang.org/rustup/dist/$(uname -m)-unknown-linux-gnu/rustup-init" && chmod +x /tmp/rustup-init && CARGO_HOME=/usr/local/cargo RUSTUP_HOME=/usr/local/rustup /tmp/rustup-init -y --no-modify-path --profile minimal --default-toolchain stable -c clippy -c rustfmt && rm /tmp/rustup-init && ln -s /usr/local/rustup/toolchains/stable-*/bin/* /usr/local/bin/',
    ]
    prepare = [
      "if [ -f Cargo.lock ]; then cargo fetch --locked; else cargo --version; fi",
    ]
    checks = [
      "cargo fmt --check",
      "cargo clippy --all-targets -- -D warnings",
      "cargo test",
    ]
    egress = [
      "crates",
      "github",
      "static.rust-lang.org",
      "release-assets.githubusercontent.com",
      "objects.githubusercontent.com",
    ]
    session_egress = true
    timeout_secs = 1800
