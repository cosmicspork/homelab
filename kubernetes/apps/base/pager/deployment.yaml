apiVersion: apps/v1
kind: Deployment
metadata:
  name: pager
  namespace: pager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pager
  # Recreate, not RollingUpdate: the subscription store is a single ReadWriteOnce
  # volume, so two pods can't mount it at once.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pager
    spec:
      automountServiceAccountToken: false
      # The relay runs as nobody (65534); fsGroup makes the block volume writable
      # so it can persist subscriptions to /data.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pager
          image: ghcr.io/cosmicspork/pager:0.7.0
          imagePullPolicy: Always
          # It writes only to /data; the PWA it serves is baked into the image.
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 4500
          env:
            # The bridge's Ed25519 public key — the only identity allowed to ingest.
            - name: PAGER_BRIDGE_PUBKEY
              value: "f3797abfe2eefceb7c7588ee88f3ca31be858f48fd7d2919f2b169c8f41191bf"
            # Persist subscriptions across restarts so devices stay registered.
            - name: PAGER_SUBS_FILE
              value: /data/subs.json
            # Surface relay info logs (startup, push results) in `kubectl logs`.
            - name: RUST_LOG
              value: info
          volumeMounts:
            - name: data
              mountPath: /data
            - name: vapid
              mountPath: /secrets
              readOnly: true
          resources:
            # Sized from measurement, not guesswork: over 16d this pod
            # averaged ~0.1m CPU and peaked at 16Mi RSS. Requests are the
            # scheduler reservation; the limit below is what actually caps it.
            requests:
              cpu: 5m
              memory: 24Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /api/config
              port: 4500
            initialDelaySeconds: 3
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /api/config
              port: 4500
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pager-data
        - name: vapid
          secret:
            secretName: pager-vapid
