# The operator API, for the ingress to reach. Not the sandbox port: only the
# node's own sandbox pods may reach that, by pod address.
apiVersion: v1
kind: Service
metadata:
  name: tracon-node
  namespace: tracon-node
spec:
  selector:
    tracon.dev/role: node
  ports:
    - name: http
      port: 80
      targetPort: 7420
