# The node accepts only its harnesses, and only on the forward and proxy
# ports. The operator reaches the interface through a port-forward (or the
# Coder tunnel), which enters via the kubelet and is not subject to this.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: tracon-node
  name: tracon-node
spec:
  podSelector:
    matchLabels:
      tracon.dev/role: node
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tracon.dev/role: harness
      ports:
        - protocol: TCP
          port: 7421
        - protocol: TCP
          port: 8888
