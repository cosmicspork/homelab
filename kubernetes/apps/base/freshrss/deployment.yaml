apiVersion: apps/v1
kind: Deployment
metadata:
  name: freshrss
  namespace: freshrss
  annotations:
    ignore-check.kube-linter.io/run-as-non-root: Root is needed to start; see the freshrss namespace labels.
    ignore-check.kube-linter.io/no-read-only-root-fs: The entrypoint rewrites config under /etc and installs a crontab.
    ignore-check.kube-linter.io/privileged-ports: Apache listens on 80, the image default; NET_BIND_SERVICE is the only cost.
spec:
  replicas: 1
  selector:
    matchLabels:
      app: freshrss
  # Recreate instead of RollingUpdate because the PVC is ReadWriteOnce —
  # two pods can't mount the same block volume simultaneously.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: freshrss
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: freshrss
          image: freshrss/freshrss:1.30.4
          # Root is needed only to start up (see the namespace), so keep just
          # the capabilities that needs: CHOWN/FOWNER/DAC_OVERRIDE for the
          # entrypoint's permission fixes on the data volume, SETUID/SETGID for
          # Apache's and su's switch to www-data, NET_BIND_SERVICE for :80.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID", "NET_BIND_SERVICE"]
          ports:
            - containerPort: 80
          env:
            - name: FRESHRSS_ENV
              value: production
            # Refresh all feeds every 30 minutes via internal cron
            - name: CRON_MIN
              value: "*/30"
          volumeMounts:
            - name: data
              mountPath: /var/www/FreshRSS/data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: freshrss-data
