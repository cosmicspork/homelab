# Object state as metrics: requests and limits per container, restarts, pod
# phases, replica counts, PVCs, and pod labels. VictoriaMetrics joins these
# with the kubelet's usage series, e.g. usage against requests, or a
# Minecraft wake from the hearth StatefulSet's replica count.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-state-metrics
      version: 8.8.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # The chart builds its ClusterRole from this list, so leaving out
    # configmaps and secrets also keeps it from reading them.
    collectors:
      - cronjobs
      - daemonsets
      - deployments
      - jobs
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - replicasets
      - statefulsets
    # kube_pod_labels carries only the labels named here. The tracon.dev
    # keys are what tie a harness pod's usage to its session and the kind of
    # work it ran.
    metricLabelsAllowlist:
      - pods=[app,app.kubernetes.io/name,tracon.dev/role,tracon.dev/session,tracon.dev/kind,tracon.dev/sizing,tracon.dev/repo,tracon.dev/channel,tracon.dev/harness,tracon.dev/phase]
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi
