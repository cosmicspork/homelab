apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracon-node
  namespace: tracon-node
spec:
  replicas: 1
  # Recreate: the state claim is ReadWriteOnce.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      tracon.dev/role: node
  template:
    metadata:
      labels:
        tracon.dev/role: node
    spec:
      serviceAccountName: tracon-node
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Seed the config onto the volume once; the node writes to it later.
        - name: seed-config
          image: ghcr.io/cosmicspork/tracon-node:0.7.0
          command: ["sh", "-c", "mkdir -p /state/config/tracon && [ -f /state/config/tracon/node.toml ] || cp /seed/node.toml /state/config/tracon/node.toml"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /state
            - name: seed
              mountPath: /seed
              readOnly: true
      containers:
        - name: node
          image: ghcr.io/cosmicspork/tracon-node:0.7.0
          args: ["serve"]
          env:
            - name: XDG_CONFIG_HOME
              value: /state/config
            - name: XDG_STATE_HOME
              value: /state
            - name: HOME
              value: /state/home
            - name: RUST_LOG
              value: tracon=info
            # The operator API answers on the pod network so the ingress can
            # reach it. Off-loopback callers need the operator token
            # (`tracon auth issue`); loopback is unchanged.
            - name: TRACON_LISTEN
              value: 0.0.0.0:7420
            - name: TRACON_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TRACON_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: TRACON_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 7420
            - name: forward
              containerPort: 7421
            - name: proxy
              containerPort: 8888
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /state
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: tracon-state
        - name: seed
          configMap:
            name: tracon-node
