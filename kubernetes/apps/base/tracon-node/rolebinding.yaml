apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: tracon-node
  name: tracon-node
  annotations:
    ignore-check.kube-linter.io/access-to-create-pods: The node creates its sandbox pods; see role.yaml.
subjects:
  - kind: ServiceAccount
    name: tracon-node
roleRef:
  kind: Role
  name: tracon-node
  apiGroup: rbac.authorization.k8s.io
