apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracon-node
  namespace: tracon-node
spec:
  replicas: 1
  # Recreate: the state claim is ReadWriteOnce.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      tracon.dev/role: node
  template:
    metadata:
      labels:
        tracon.dev/role: node
    spec:
      serviceAccountName: tracon-node
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Seed the config onto the volume once; the node writes to it later.
        - name: seed-config
          image: ghcr.io/cosmicspork/tracon-node:0.33.1
          command: ["sh", "-c", "mkdir -p /state/config/tracon /state/tmp && [ -f /state/config/tracon/node.toml ] || cp /seed/node.toml /state/config/tracon/node.toml"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /state
            - name: seed
              mountPath: /seed
              readOnly: true
      containers:
        - name: node
          image: ghcr.io/cosmicspork/tracon-node:0.33.1
          args: ["serve"]
          env:
            - name: XDG_CONFIG_HOME
              value: /state/config
            - name: XDG_STATE_HOME
              value: /state
            - name: HOME
              value: /state/home
            - name: RUST_LOG
              value: tracon=info
            # Build contexts and image layers staged for buildctl can be large;
            # keep them on the state volume, not the container's overlay.
            - name: TMPDIR
              value: /state/tmp
            # The operator API answers on the pod network so the ingress can
            # reach it. Off-loopback callers need the operator token
            # (`tracon auth issue`); loopback is unchanged.
            - name: TRACON_LISTEN
              value: 0.0.0.0:7420
            # A Deployment's pod is started again whenever its process exits,
            # so a restart asked for through the API is a clean exit.
            - name: TRACON_RESTART_BY_EXIT
              value: "1"
            - name: TRACON_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TRACON_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: TRACON_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 7420
            - name: forward
              containerPort: 7421
            - name: proxy
              containerPort: 8888
            - name: egress
              containerPort: 7424
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /state
            # [runtime.kubernetes.builder] tls_dir: the client certificate for
            # buildkitd's mutual TLS (cert-manager, buildkit-ca).
            - name: buildkit-client
              mountPath: /etc/tracon/buildkit
              readOnly: true
            # [runtime.kubernetes.builder] docker_config: config.json with the
            # DOCR read-write credential. buildctl answers the daemon's token
            # requests itself, so the credential stays in this pod.
            - name: registry
              mountPath: /etc/tracon/registry
              readOnly: true
          # No CPU limit: throttling the node stalls every session it serves.
          # The memory limit stops a leak from taking the shared node down.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: tracon-state
        - name: seed
          configMap:
            name: tracon-node
        - name: buildkit-client
          secret:
            secretName: buildkit-client-tls
            defaultMode: 0440
        - name: registry
          secret:
            secretName: tracon-docr
            defaultMode: 0440
            items:
              - key: config.json
                path: config.json
