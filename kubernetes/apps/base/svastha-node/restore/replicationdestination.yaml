apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: svastha-node-identity
  namespace: svastha-node
spec:
  # Runs once, when created: restores the newest snapshot, which the PVC's
  # dataSourceRef then fills from. Changing the value would restore again,
  # but only into a new snapshot; a bound claim is never refilled.
  trigger:
    manual: restore-once
  restic:
    repository: svastha-node-identity-restic
    copyMethod: Snapshot
    volumeSnapshotClassName: do-block-storage
    capacity: 1Gi
    accessModes: ["ReadWriteOnce"]
    # The restore's working volume and restic cache are throwaway.
    storageClassName: do-block-storage
    cacheStorageClassName: do-block-storage
    cacheCapacity: 1Gi
    cleanupTempPVC: true
    cleanupCachePVC: true
    # The app's own user, as in backup.yaml. Ownership comes back as this
    # user: an unprivileged mover can't chown, so a file the snapshot has as
    # root returns owned by the app (group and mode are kept).
    moverSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    moverResources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 512Mi
