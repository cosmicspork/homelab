# Defaults for containers that name no resources. Since tracon 0.33 the node
# sizes its own harness pods ([runtime.kubernetes.resources] in node.toml), so
# this is only a fallback for anything else started in the namespace.
#
# The 2Gi memory limit is the point: without it a runaway process could take
# memory from everything else on the shared node. There is no default CPU
# limit, since throttling only slows a pod down and CPU is shared fairly by
# request anyway.
#
# A container that sets a memory request above 2Gi must also set its own
# limit, or the API server rejects it (request above the defaulted limit).
apiVersion: v1
kind: LimitRange
metadata:
  namespace: tracon-node
  name: tracon-node
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      default:
        memory: 2Gi
