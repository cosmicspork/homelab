apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buildkit-cache
  namespace: tracon-build
spec:
  accessModes:
    - ReadWriteOnce
  # Not the retain class: this is a cache that rebuilds itself, so deleting
  # the claim should delete the volume rather than leave a 100Gi block volume
  # billing in the DO account. Both classes allow expansion, so it can grow in
  # place.
  storageClassName: do-block-storage
  resources:
    requests:
      storage: 100Gi
