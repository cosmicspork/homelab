# Feasibility check for rootless BuildKit on the DOKS kernel. Runs once when
# Flux applies it: connects over mTLS the way the tracon node will (a TLS
# directory with cert-manager's file names), prints the worker (including the
# snapshotter in use), checks that it can reach a registry token endpoint (the
# client fetches Bearer tokens, see networkpolicy.yaml), then builds a
# Dockerfile with a RUN step, which exercises the user namespace, runc and the
# snapshotter, without pushing.
#
# Complete means rootless works here. The finished Job stays for inspection.
# The force annotation lets Flux delete and recreate it when its spec changes
# (a Job's template is immutable), so a BuildKit upgrade from Renovate reruns
# the check. Delete the Job to rerun it on the next reconcile.
apiVersion: batch/v1
kind: Job
metadata:
  name: buildkit-smoke
  namespace: tracon-build
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkit-smoke
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          # Only the client is used; same image so Renovate bumps both
          # together.
          image: moby/buildkit:v0.34.0-rootless
          command:
            - sh
            - -c
            - |
              set -eu
              export BUILDKIT_HOST=tcp://buildkitd.tracon-build.svc:1234
              mkdir -p /work/ctx
              printf '%s\n' \
                'FROM docker.io/library/busybox:1.37' \
                'RUN echo "rootless buildkit ok on kernel $(uname -r)" | tee /ok' \
                > /work/ctx/Dockerfile
              # buildkitd may still be attaching its volume or pulling.
              tries=0
              until buildctl --tlsdir /tls debug workers --verbose; do
                tries=$((tries + 1))
                if [ "$tries" -ge 60 ]; then
                  echo "buildkitd unreachable after 10 minutes" >&2
                  exit 1
                fi
                sleep 10
              done
              # The client, not buildkitd, fetches registry Bearer tokens, so
              # this pod needs HTTPS to the token realm. Say so plainly if it
              # cannot, rather than leave only a DeadlineExceeded from the build.
              realm='https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/busybox:pull'
              if wget -q -T 15 -O /dev/null "$realm"; then
                echo "client reaches the Docker Hub token endpoint"
              else
                echo "client cannot reach auth.docker.io:443; check the buildkit-smoke NetworkPolicy" >&2
              fi
              buildctl --tlsdir /tls build \
                --progress=plain \
                --no-cache \
                --frontend dockerfile.v0 \
                --local context=/work/ctx \
                --local dockerfile=/work/ctx \
                --output type=image,name=tracon-build-smoke:latest,push=false
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: work
              mountPath: /work
      volumes:
        - name: tls
          secret:
            secretName: buildkit-smoke-tls
        - name: work
          emptyDir: {}
