# `POST /capture` takes no credential — a bridge is reached over loopback or a
# pod network, never exposed. This is what makes that true here: only the
# tracon node may reach it, and there is no ingress for it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pager-bridge
  namespace: pager
spec:
  podSelector:
    matchLabels:
      app: pager-bridge
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tracon-node
          podSelector:
            matchLabels:
              tracon.dev/role: node
      ports:
        - protocol: TCP
          port: 4500
